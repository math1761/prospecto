services:
  db:
    image: postgres:16-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: prospecto
      POSTGRES_USER: prospecto
      POSTGRES_PASSWORD: prospecto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospecto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
